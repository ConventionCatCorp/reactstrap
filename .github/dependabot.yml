version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      storybook:
        patterns: ['storybook', '@storybook/*']
      testing:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', 'jsdom']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
